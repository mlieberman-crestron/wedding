# Build-from-source variant. Used over SSH on the NAS:
#   cd /Volume1/docker/wedding && sh scripts/deploy.sh
# (which runs `docker compose up -d --build`).
#
# Values like ${HOST_PORT:-8088} are read from a file named .env next to this
# file (copy .env.example to .env); the part after :- is the default used
# when .env or the variable is missing.

name: wedding   # compose project name -> container is named wedding-web-1

services:
  web:
    build: .
    image: wedding-skeleton:local      # name for the locally built image
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8088}:3000"      # NAS port : container port
    environment:
      APP_ENV: ${APP_ENV:-dev}
      EVENT_NAME: ${EVENT_NAME:-Casey & Dustin}
      PORT: "3000"
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CHANGE_ME}
      SIDE_A_LABEL: ${SIDE_A_LABEL:-Casey}
      SIDE_B_LABEL: ${SIDE_B_LABEL:-Dustin}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - ./data:/data                   # SQLite file lives here on the NAS
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
